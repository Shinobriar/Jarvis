name: Build FrameLab APK

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: unzip -q FrameLab_Android_Source.zip
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile installable APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd FrameLab
          gradle assembleDebug --stacktrace --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameLab-Android-APK
          path: FrameLab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to build-only branch
        run: |
          cp FrameLab/app/build/outputs/apk/debug/app-debug.apk /tmp/FrameLab.apk
          git fetch origin framelab-apk-build-20261024
          git checkout -B framelab-apk-build-20261024 origin/framelab-apk-build-20261024
          mkdir -p built
          cp /tmp/FrameLab.apk built/FrameLab.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add built/FrameLab.apk
          git commit -m "Build FrameLab installable Android APK"
          git push origin HEAD:framelab-apk-build-20261024
