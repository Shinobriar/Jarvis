plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shinobriar.xlocal'
    compileSdk 35

    defaultConfig {
        applicationId "com.shinobriar.xlocal"
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName "0.18.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
